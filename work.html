<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Patatooo</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
sans-serif;

background-size:cover;
background-position:center;

transition:.8s;

}


body::before{

content:"";

position:fixed;
inset:0;

background:
rgba(0,0,0,.25);

z-index:-1;

}


.container{

width:100%;
max-width:380px;

text-align:center;

}


.avatar{

width:110px;
height:110px;

border-radius:50%;

border:
3px solid
rgba(255,255,255,.7);

box-shadow:
0 0 30px rgba(255,255,255,.5);

object-fit:cover;

}



h1{

color:white;

font-size:34px;

margin:18px 0 22px;

text-shadow:
0 5px 20px #000;

}



.glass{

background:
rgba(255,255,255,.22);

border:
1px solid
rgba(255,255,255,.35);


backdrop-filter:
blur(30px)
saturate(180%);

-webkit-backdrop-filter:
blur(30px)
saturate(180%);


box-shadow:
0 15px 40px rgba(0,0,0,.25);

border-radius:24px;

}



.home{

display:block;

width:85%;

margin:auto;

padding:10px;


color:white;

text-decoration:none;

font-size:15px;

}



.card{

padding:14px;

margin-top:12px;

}



.card h2{

margin:0 0 10px;

font-size:18px;

color:white;

}



.btn{

display:block;

width:90%;

margin:8px auto 0;

padding:8px 12px;


border-radius:14px;


font-size:14px;


color:white;

text-decoration:none;


background:
rgba(255,255,255,.16);


border:
1px solid
rgba(255,255,255,.25);


cursor:pointer;

}



.btn:active{

transform:scale(.96);

}


.install{

color:#00f0ff;

}


.copy{

color:#39ff14;

}


</style>

</head>


<body>


<div class="container">


<img
class="avatar"
src="https://q1.qlogo.cn/g?b=qq&nk=3183339668&s=640">


<h1>
Patatooo
</h1>



<a
class="glass home"
href="https://www.ltyun001.com/"
target="_blank">

官网

</a>




<div class="glass card">

<h2>
Shadowrocket
</h2>


<a
class="btn install"
href="shadowrocket://install?module=https://raw.githubusercontent.com/Patato-H/LT/refs/heads/main/Shadowrocket.module">

安装模块

</a>


<button
class="btn copy"
onclick="copyText('https://raw.githubusercontent.com/Patato-H/LT/refs/heads/main/Shadowrocket.module')">

复制链接

</button>


</div>





<div class="glass card">

<h2>
Loon
</h2>


<a
class="btn install"
href="loon://import?plugin=https://raw.githubusercontent.com/Patato-H/LT/refs/heads/main/Loon.lpx">

安装插件

</a>


<button
class="btn copy"
onclick="copyText('https://raw.githubusercontent.com/Patato-H/LT/refs/heads/main/Loon.lpx')">

复制链接

</button>


</div>





<div class="glass card">

<h2>
Egern
</h2>


<a
class="btn install"
href="egern://import?config=https://raw.githubusercontent.com/Patato-H/LT/refs/heads/main/Egern.yaml">

导入配置

</a>


<button
class="btn copy"
onclick="copyText('https://raw.githubusercontent.com/Patato-H/LT/refs/heads/main/Egern.yaml')">

复制链接

</button>


</div>



</div>



<script>


async function bingBackground(){

try{

let idx=Math.floor(Math.random()*8);


let api=
`https://cn.bing.com/HPImageArchive.aspx?format=js&idx=${idx}&n=1`;


let res=await fetch(api);

let data=await res.json();


let img=
"https://cn.bing.com"
+
data.images[0].url;


document.body.style.backgroundImage=
`url("${img}")`;


}catch(e){

console.log(e);

}


}


bingBackground();



function copyText(text){

navigator.clipboard.writeText(text)
.then(()=>{

alert("复制成功");

});

}


</script>


</body>
</html>
